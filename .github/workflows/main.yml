name: fitness-v10-shanghai

on:
  workflow_dispatch:

  schedule:
    # 🥣 08:30 上海时间
    - cron: "30 0 * * *"

    # 🍽 12:00 上海时间
    - cron: "0 4 * * *"

    # ⚡ 15:30 上海时间
    - cron: "30 7 * * *"

    # 🏋️ 18:00 上海时间
    - cron: "0 10 * * *"

    # 🌙 21:00 上海时间
    - cron: "0 13 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install requests

      - run: python main.py
